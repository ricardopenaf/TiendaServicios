version: "3.9"

# ──────────────────────────────────────────────────────────────────
# FunEvents — Entorno de desarrollo local (alternativa a Aspire)
# Uso: docker compose up -d
# ──────────────────────────────────────────────────────────────────

services:

  certs-init:
    image: alpine:3.20
    container_name: funevents-certs-init
    volumes:
      - ./certs:/certs-src:ro
      - funevents-pgcerts:/certs-dest
    command: >
      sh -c "cp /certs-src/server.crt /certs-src/server.key /certs-src/ca.crt /certs-dest/ &&
             chown 70:70 /certs-dest/server.key &&
             chmod 600 /certs-dest/server.key &&
             chmod 644 /certs-dest/server.crt /certs-dest/ca.crt"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: funevents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       funevents
      POSTGRES_USER:     funevents
      POSTGRES_PASSWORD: funevents123
    ports:
      - "5432:5432"
    volumes:
      - funevents-pgdata:/var/lib/postgresql/data
      - funevents-pgcerts:/certs:ro
      - ./certs/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    command: >
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
      -c ssl_ca_file=/certs/ca.crt
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funevents"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
      pgadmin-net:
        aliases:
          - postgres

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: funevents-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@funevents.co
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  funevents-pgdata:
    external: true
    name: funevents_funevents-pgdata
  funevents-pgcerts:

networks:
  default:
  # Red del pgAdmin ya existente (proyecto "funevents"), para que
  # pueda seguir resolviendo el hostname "postgres" tras recrear el contenedor.
  pgadmin-net:
    name: funevents_default
    external: true
