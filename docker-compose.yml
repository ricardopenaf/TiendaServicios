version: "3.9"

# ──────────────────────────────────────────────────────────────────
# FunEvents — Entorno de desarrollo local (alternativa a Aspire)
# Uso: docker compose up -d
# ──────────────────────────────────────────────────────────────────

services:

  certs-init:
    image: alpine:3.20
    volumes:
      - ./certs:/certs-src:ro
      - funevents-pgcerts:/certs-dest
    command: >
      sh -c "cp /certs-src/server.crt /certs-src/server.key /certs-src/ca.crt /certs-dest/ &&
             chown 70:70 /certs-dest/server.key &&
             chmod 600 /certs-dest/server.key &&
             chmod 644 /certs-dest/server.crt /certs-dest/ca.crt"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       funevents
      POSTGRES_USER:     funevents
      POSTGRES_PASSWORD: funevents123
    ports:
      - "5432:5432"
    volumes:
      - funevents-pgdata:/var/lib/postgresql/data
      - funevents-pgcerts:/certs:ro
      - ./certs/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    command: >
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
      -c ssl_ca_file=/certs/ca.crt
    depends_on:
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funevents"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
      pgadmin-net:
        aliases:
          - postgres

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@funevents.co
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  tiendaservicio.api.autor:
    image: ${DOCKER_REGISTRY-}tiendaservicioapiautor
    build:
      context: .
      dockerfile: TiendaServicio.Api.Autor/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Sql2026Server!
    ports:
      - "1433:1433"
    volumes:
      - tiendalibro-mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  tiendaservicios.api.libro:
    image: ${DOCKER_REGISTRY-}tiendaserviciosapilibro
    build:
      context: .
      dockerfile: TiendaServicios.Api.Libro/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: carritocompra
      MYSQL_ROOT_PASSWORD: "12345"
    ports:
      # 3306 del host está ocupado por un MySQL local; se expone en 3307
      # para acceso externo (p.ej. un cliente de BD), el contenedor sigue
      # escuchando en 3306 y se resuelve como "mysql:3306" en la red de compose.
      - "3307:3306"
    volumes:
      - carritocompra-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  tiendaservicios.api.carritocompra:
    image: ${DOCKER_REGISTRY-}tiendaserviciosapicarritocompra
    build:
      context: .
      dockerfile: TiendaServicios.Api.CarritoCompra/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      tiendaservicios.api.libro:
        condition: service_started

  tiendaservicios.api.gateway:
    image: ${DOCKER_REGISTRY-}tiendaserviciosapigateway
    build:
      context: .
      dockerfile: TiendaServicios.Api.Gateway/Dockerfile
    depends_on:
      tiendaservicio.api.autor:
        condition: service_started
      tiendaservicios.api.libro:
        condition: service_started
      tiendaservicios.api.carritocompra:
        condition: service_started

volumes:
  funevents-pgdata:
    external: true
    name: funevents_funevents-pgdata
  funevents-pgcerts:
  tiendalibro-mssqldata:
  carritocompra-mysqldata:

networks:
  default:
  # Red del pgAdmin ya existente (proyecto "funevents"), para que
  # pueda seguir resolviendo el hostname "postgres" tras recrear el contenedor.
  pgadmin-net:
    name: funevents_default
    external: true
