# TYPE  DATABASE  USER  ADDRESS         METHOD

local   all       all                   trust

# Conexiones desde el host de Windows (localhost:5432) exigen
# certificado de cliente válido firmado por nuestra CA local (mTLS).
hostssl all       all   127.0.0.1/32    cert clientcert=verify-full
hostssl all       all   ::1/128         cert clientcert=verify-full

# Resto de conexiones (ej. pgAdmin dentro de la red Docker) siguen
# autenticando por contraseña, como hasta ahora.
host    all       all   all             scram-sha-256
hostssl all       all   all             scram-sha-256
